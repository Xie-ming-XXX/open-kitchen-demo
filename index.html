<!doctype html>

  <title>间 · 开放式厨房</title>

<body>
  <main class="workspace">
    <section id="viewer" aria-label="厨房三维展示" data-i18n-aria="viewerLabel">
      <div class="intro"><p class="eyebrow">A PLACE FOR EVERYDAY</p><h1 data-i18n="heroTitle">让日常，有序发生。</h1><p data-i18n="heroSubtitle">一张中岛，连接烹饪与生活。</p></div>
      <canvas id="scene" aria-label="厨房模型，拖动旋转、滚轮缩放；点击柜门与抽屉开合；聚焦画布后按 Tab 选择部件、Enter 开合。" data-i18n-aria="sceneLabel" tabindex="0"></canvas>
      <button id="immersive" title="隐藏界面；按 Esc 或双击画面退出" data-i18n-title="immersiveTitle" aria-label="沉浸观看，按 Esc 或双击画面退出" data-i18n-aria="immersiveAria"><span aria-hidden="true">⛶</span></button>
      <div id="loading" role="status"><span data-i18n="loadingTitle">正在打开厨房</span><small data-i18n="loadingDetail">加载空间与材质…</small></div>
      <div class="view-bottom"><div class="view-tabs" aria-label="观察视角" data-i18n-aria="viewsLabel"><button data-view="overview" class="selected" aria-pressed="true" data-i18n="overview">整体</button><button data-view="prep" aria-pressed="false" data-i18n="workZone">操作区</button><button data-view="top" aria-pressed="false" data-i18n="planView">俯视布局</button><button id="tour" aria-pressed="false"></button></div><p id="view-hint" data-i18n="viewHint">点击柜门开合 · 拖动旋转 · 滚轮缩放</p></div>
      <div class="scene-caption"><span data-i18n="captionLeft">把烟火日常，装进理想厨房。</span><span data-i18n="captionRight">有序收纳，自在生活。</span></div>
    </section>
    <aside class="panel" aria-label="厨房控制" data-i18n-aria="controlsLabel">
      <div class="panel-heading"><p class="eyebrow">OPEN KITCHEN</p><h2 data-i18n="panelTitle">开放式厨房</h2><button id="language-toggle" type="button" aria-label="切换到英文" data-i18n-aria="languageAria"><span data-lang="zh">中</span><i aria-hidden="true"></i><span data-lang="en">EN</span></button></div>
      <nav class="experience-tabs" aria-label="探索方式" data-i18n-aria="exploreLabel"><button data-panel="browse" aria-pressed="true" data-i18n="spatialPlan">空间方案</button><button data-panel="detail" aria-pressed="false" data-i18n="features">功能细节</button></nav>
      <section class="control-group" data-section="browse"><h3 data-i18n="workflow">动线规划</h3><div id="journey-steps"></div><button class="control" id="dimensions" aria-pressed="false" data-i18n="dimensions">空间尺度</button><p id="dimension-note" class="help" hidden></p><label class="select-label"><span data-i18n="palette">材质配色</span><select id="palette"><option value="teak" data-i18n="paletteTeak">柚木 · 奶油白</option><option value="oak" data-i18n="paletteOak">浅木 · 奶油白</option><option value="greige" data-i18n="paletteGreige">暖灰 · 奶油白</option></select></label></section>
      <section class="control-group" data-section="detail" hidden><h3><span>01</span> <b data-i18n="equipment">设备控制</b></h3><button class="control" data-action="heat" aria-pressed="false"><span><span data-i18n="ovenHeat">烤箱加热</span><small id="oven-status"></small></span><b data-value="heat"></b></button><button class="control" data-action="hood" aria-pressed="false"><span><span data-i18n="hood">嵌入式烟机</span><small id="hood-status"></small></span><b data-value="hood"></b></button><button class="control" data-action="lights" aria-pressed="true"><span><span data-i18n="workLight">台面工作灯</span><small id="light-status"></small></span><b class="switch" data-value="lights"></b></button><label class="select-label"><span data-i18n="lighting">光照场景</span><select id="ambience"><option value="day" data-i18n="daylight">日间自然光</option><option value="evening" data-i18n="evening">夜间柔光</option></select></label></section>
      <section class="control-group structure" data-section="detail" hidden><h3><span>02</span> <b data-i18n="construction">构造解析</b></h3><div class="structure-buttons"><button id="rails" aria-pressed="false" data-i18n="rails">抽屉滑轨</button><button id="vent" aria-pressed="false" data-i18n="ventilation">烤箱散热</button><button id="hood-detail" aria-pressed="false" data-i18n="hoodInstall">烟机安装</button></div><div id="structure-note" hidden></div><label class="select-label" id="travel-control" hidden><span data-i18n="drawerTravel">抽屉行程</span> <output id="travel-value">400 mm</output><input id="travel" type="range" min="0" max="400" value="400" step="5"></label><button id="exit-structure" hidden><span aria-hidden="true">←</span> <span data-i18n="backKitchen">返回完整厨房</span></button></section>
      <div class="panel-footer"><p id="feedback" role="status" aria-live="polite"></p><button id="reset"><span aria-hidden="true">↺</span> <span data-i18n="reset">重置场景</span></button></div>
    </aside>
  </main>
